[project]
site_name = "Home-Ops"
site_description = "Betriebshandbuch für den Home-Kubernetes-Cluster"
site_url = "https://docs.offene.cloud/"
repo_url = "https://code.offene.cloud/homelab/kops"
repo_name = "homelab/kops"
edit_uri = "_edit/main/docs/content/"
docs_dir = "content"
site_dir = "site"

nav = [
  { "Start" = "index.md" },
  { "Runbooks" = [
    "runbooks/index.md",
    { "Talos-Upgrade" = "runbooks/talos-upgrade.md" },
    { "Doku-Bucket" = "runbooks/docs-bucket.md" },
  ] },
  { "Architektur" = [
    "architecture/index.md",
  ] },
  { "Entscheidungen" = [
    "decisions/index.md",
    { "0001 Doku mit Zensical und Garage" = "decisions/0001-docs-zensical-garage.md" },
  ] },
  { "Troubleshooting" = [
    "troubleshooting/index.md",
  ] },
]

[project.theme]
language = "de"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/server"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Helles Design"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Dunkles Design"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Systemeinstellung"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
