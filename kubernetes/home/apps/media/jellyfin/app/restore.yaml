---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: "${APP}-dst-2"
spec:
  trigger:
    manual: restore-once
  kopia:
    copyMethod: Direct
    restoreAsOf: "2026-08-30T00:00:00Z"
    destinationPVC: ${APP}-1
    accessModes:
      - ${VOLSYNC_ACCESSMODES:=ReadWriteOnce}
    cacheAccessModes:
      - ${VOLSYNC_CACHE_ACCESSMODES:=ReadWriteOnce}
    cacheCapacity: ${VOLSYNC_CAPACITY:=5Gi}
    cacheStorageClassName: ${VOLSYNC_CACHE_STORAGECLASS:=local-hostpath}
    capacity: ${VOLSYNC_CAPACITY:=5Gi}
    cleanupCachePVC: true
    cleanupTempPVC: true
    enableFileDeletion: true
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: ${VOLSYNC_UID:=1000}
      runAsGroup: ${VOLSYNC_GID:=1000}
      fsGroup: ${VOLSYNC_GID:=1000}
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    repository: volsync-kopia-secret
    sourceIdentity:
      sourceName: ${APP}-backup
    storageClassName: ${VOLSYNC_STORAGECLASS:=local-hostpath}
    volumeSnapshotClassName: ${VOLSYNC_SNAPSHOTCLASS:=csi-local-hostpath}
