---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arr-stack
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: arr-stack
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/home/apps/media/arr-stack/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: arr-stack
      KOPIUR_CAPACITY: 50Gi
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: arr-stack-configarr
  dependsOn:
    - name: arr-stack
  interval: 1h
  path: ./kubernetes/home/apps/media/arr-stack/configarr
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
