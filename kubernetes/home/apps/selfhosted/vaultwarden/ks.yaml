---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: vaultwarden
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/home/apps/selfhosted/vaultwarden/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: volsync-kopia-secret
        kind: Secret
    substitute:
      APP: vaultwarden
      VOLSYNC_CLAIM: vaultwarden-data
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_GID: "2000"
      VOLSYNC_UID: "2000"
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
