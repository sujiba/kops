---
# Test app for the towonel tunnel: echoes the request, so X-Real-IP shows whether
# the visitor's address survived the PROXY chain from hcloud.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whoami
spec:
  chartRef:
    kind: OCIRepository
    name: whoami
  interval: 1h
  values:
    defaultPodOptions:
      # envoy-tunnel may only reach pods with this label (network/towonel)
      labels:
        offene.cloud/expose: tunnel

    controllers:
      whoami:
        pod:
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
        containers:
          app:
            image:
              repository: ghcr.io/traefik/whoami
              tag: v1.12.0
            env:
              WHOAMI_PORT_NUMBER: "8080"
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true

    networkpolicies:
      whoami:
        type: cilium
        description: >-
          Public through the towonel tunnel: reachable from envoy-tunnel only,
          not from the LAN or other pods.
        ingress:
          - fromEntities:
              - host # kubelet probes
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.envoyproxy.io/owning-gateway-name: envoy-tunnel
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP

    route:
      app:
        hostnames:
          - whoami.extern.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-tunnel
            namespace: network
            sectionName: https

    service:
      app:
        ports:
          http:
            port: 8080
