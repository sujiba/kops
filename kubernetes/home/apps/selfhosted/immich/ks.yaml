---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: immich
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/home/apps/selfhosted/immich/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: immich
      KOPIUR_CAPACITY: 300Gi
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
