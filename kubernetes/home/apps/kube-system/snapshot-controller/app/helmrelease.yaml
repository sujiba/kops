---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 5.4.0
      url: oci://ghcr.io/piraeusdatastore/helm-charts/snapshot-controller
  interval: 1h
  values:
    installCRDs: true
    controller:
      replicaCount: 1
      serviceMonitor:
        create: true
      args:
        enableDistributedSnapshotting: true
    webhook:
      enabled: false
