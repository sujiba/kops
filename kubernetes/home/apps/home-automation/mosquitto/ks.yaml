---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mosquitto
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: mosquitto
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/home/apps/home-automation/mosquitto/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: mosquitto
      KOPIUR_CAPACITY: 1Gi
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home-automation
  wait: false
