---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-agent
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-agent
  interval: 1h

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault

    controllers:
      towonel-agent:
        annotations:
          reloader.stakater.com/auto: "true"
        # Stateless: dials the edge on hcloud over QUIC and forwards each
        # connection to the origin of its hostname
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: codeberg.org/towonel/towonel-agent
              tag: 1.13.4@sha256:5ee0a6096c054f2c874015593afb8370be8723829a1640cbfa4ec138f85fef41
            env:
              TOWONEL_AGENT_HEALTH_LISTEN_ADDR: 0.0.0.0:9090
              # Passthrough: TLS ends at envoy-tunnel, which gets the visitor's
              # address as PROXY v2. One entry per hostname served from home.
              TOWONEL_AGENT_SERVICES: >-
                [
                {"hostname": "hello.extern.${EXTERNAL_DOMAIN}", "origin": "envoy-tunnel.network.svc.cluster.local:443", "tls_mode": {"mode": "passthrough"}, "proxy_protocol": "v2"}
                ]
              # Throughput collapses with UDP GSO on Cilium
              TOWONEL_DISABLE_UDP_GSO: "true"
            envFrom:
              - secretRef:
                  name: towonel-agent-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9090
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9090
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true

    networkpolicies:
      towonel-agent:
        type: cilium
        description: >-
          Out to hcloud only (hub API and QUIC to the edge) and to
          envoy-tunnel, nothing else. Internet traffic enters the homelab
          through this pod, so it must not reach the LAN, other workloads or
          the rest of the internet.
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: ANY
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.envoyproxy.io/owning-gateway-name: envoy-tunnel
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
          # hcloud (tunnel.${EXTERNAL_DOMAIN}): hub API over HTTPS, QUIC to the edge
          - toCIDR:
              - 91.98.37.31/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "51820"
                    protocol: UDP
        ingress:
          - fromEntities:
              - host # kubelet probes
