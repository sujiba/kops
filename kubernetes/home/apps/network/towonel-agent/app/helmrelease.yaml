---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-agent
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-agent
  interval: 1h

  values:
    # Stateless: dials the edge on hcloud over QUIC and forwards each
    # connection to the origin of its hostname
    agent:
      inviteTokenSecret:
        name: towonel-agent-secret
      # Passthrough: TLS ends at envoy-tunnel, which gets the visitor's
      # address as PROXY v2. One wildcard for everything below extern: which
      # app answers is decided by the routes on envoy-tunnel.
      services:
        - hostname: "*.extern.${EXTERNAL_DOMAIN}"
          origin: envoy-tunnel.network.svc.cluster.local:443
          proxy_protocol: v2
          tls_mode:
            mode: passthrough

    # Throughput collapses with UDP GSO on Cilium
    disableUdpGso: true

    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2

        containers:
          main:
            # Same image as the chart default (git.ow-ops.eu), from Codeberg;
            # tag and digest follow the chart version
            image:
              repository: codeberg.org/towonel/towonel-agent
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi

    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true

    serviceMonitor:
      main:
        enabled: true
