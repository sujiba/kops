---
# Own policy, nothing shared with envoy-internal. The agent prepends PROXY v2 with
# the visitor's address (the edge on hcloud got it from Envoy there the same way).
# Without the header a connection is refused.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-tunnel
spec:
  # The address from the PROXY header is the client, for the geoip filter too.
  # xForwardedFor would read X-Forwarded-For, which a visitor can send themselves.
  clientIPDetection:
    directSourceIP: {}
  # Same headers as envoy-external on hcloud
  headers:
    earlyRequestHeaders:
      set:
        - name: X-Real-IP
          value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Host
          value: "%REQ(:authority)%"
        - name: X-Forwarded-Uri
          value: "%REQ(:path)%"
    lateResponseHeaders:
      remove:
        - "x-powered-by"
        - "x-xss-protection"
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains; preload
        - name: Referrer-Policy
          value: same-origin, strict-origin-when-cross-origin
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: server
          value: "UwU"
        - name: X-Robots-tag
          value: "noindex, nofollow"
  http2:
    onInvalidMessage: TerminateStream
  proxyProtocol:
    optional: false
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-tunnel
      sectionName: https
  tcpKeepalive: {}
  timeout:
    http:
      idleTimeout: 60s
  # TLS ends here, not on hcloud (passthrough). Same settings as envoy-external on hcloud.
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    ecdhCurves:
      - X25519MLKEM768
      - X25519
      - P-256
    alpnProtocols:
      - h2
      - http/1.1
