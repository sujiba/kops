---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 10m
      ref:
        tag: v1.21.3
      url: oci://quay.io/jetstack/charts/cert-manager
  values:
    crds:
      enabled: true
    cainjector:
      replicaCount: 1
    dns01RecursiveNameservers: https://dns.quad9.net/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
