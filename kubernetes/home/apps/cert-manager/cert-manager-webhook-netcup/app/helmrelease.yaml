---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-netcup
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 1.1.1
      url: oci://ghcr.io/aellwein/cert-manager-webhook-netcup/cert-manager-webhook-netcup
  values:
    groupName: com.netcup.webhook
    certManager:
      namespace: cert-manager
      serviceAccountName: cert-manager
    image:
      repository: ghcr.io/aellwein/cert-manager-webhook-netcup
      tag: 1.1.1
      type: ClusterIP
      port: 443
