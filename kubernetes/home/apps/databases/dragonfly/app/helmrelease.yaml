---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: v1.7.1
      url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
  install:
    crds: CreateReplace
  interval: 1h
  values:
    serviceMonitor:
      enabled: false
