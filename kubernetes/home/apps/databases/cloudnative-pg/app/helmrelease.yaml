---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: databases
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.29.1
      url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
  interval: 1h
  values:
    crds:
      create: true
    resources:
      requests:
        cpu: 20m
        memory: 100Mi
      limits:
        memory: 200Mi
