---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: forgejo://code.offene.cloud/homelab/kops
      statusChecks: true
      prComments: true
      verifyImages: true
      publicUrl: https://konflate.${INTERNAL_DOMAIN}
      mcp: true
    secret:
      existingSecret: konflate-secret
    httpRoute:
      enabled: true
      hostnames:
        - konflate.${INTERNAL_DOMAIN}
      parentRefs:
        - name: envoy-internal
          namespace: network
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi
