---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: konflate
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: konflate
  interval: 1h
  path: ./kubernetes/home/apps/flux-system/konflate/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  timeout: 5m
  wait: false

