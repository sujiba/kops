---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopiur-s3
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
      bucket: kopiur-backup
      endpoint: fsn1.your-objectstorage.com
      region: eu-central
  create:
    enabled: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: Europe/Berlin
