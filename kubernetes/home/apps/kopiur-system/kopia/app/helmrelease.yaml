---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopia
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  interval: 1h

  values:
    controllers:
      kopia:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/kopia
              tag: 0.23.1@sha256:6025a14d5a673bc38de3efdf48711ee93f0130787798b677c85ca95d4eaa0f7a
            env:
              KOPIA_WEB_ENABLED: true
              KOPIA_WEB_PORT: &port 8080
              TZ: Europe/Berlin
            envFrom:
              - secretRef:
                  name: kopiur-repository-secret
            args:
              - --without-password
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 15m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - kopia.${INTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network

    configMaps:
      config:
        data:
          repository.config: |-
            {
              "storage": {
                "type": "s3",
                "config": {
                  "bucket": "kopiur-backup",
                  "endpoint": "fsn1.your-objectstorage.com",
                  "accessKeyID": "${AWS_ACCESS_KEY_ID}",
                  "secretAccessKey": "${AWS_SECRET_ACCESS_KEY}",
                  "region": "eu-central"
                }
              },
              "caching": {
                "cacheDirectory": "cache",
                "maxCacheSize": 5242880000,
                "maxMetadataCacheSize": 5242880000,
                "maxListCacheDuration": 30
              },
              "hostname": "kopia",
              "username": "nobody",
              "description": "kopiur-backup",
              "enableActions": false,
              "formatBlobCacheDuration": 900000000000
            }

    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/repository.config
            subPath: repository.config
      tmpfs:
        type: emptyDir
        advancedMounts:
          kopia:
            app:
              - path: /config/cache
                subPath: cache
              - path: /config/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
