---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: forgejo-runner-config
    files:
      - ./resources/config.yaml

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled

resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./secrets.sops.yaml
