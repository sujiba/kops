---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel
spec:
  chartRef:
    kind: OCIRepository
    name: towonel
  interval: 1h
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault

    controllers:
      towonel:
        annotations:
          reloader.stakater.com/auto: "true"
        # Hub and edge in one pod, on the pod network. Envoy owns the node's ports
        # and hands the edge its traffic: raw TLS via TLSRoute (with PROXY v2, so
        # the edge knows the client), QUIC from the agent via UDPRoute.
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: codeberg.org/towonel/towonel-node
              tag: 1.13.4@sha256:2b21f73776524e5c06e661f27f712352ce83e14331dafd6a66d59fabe0da1274
            env:
              TOWONEL_DATA_DIR: /data
              # host:port the agent reaches; the QUIC address is derived from it
              # with TOWONEL_EDGE_IROH_PORT (UDP 51820, open in the hcloud firewall)
              TOWONEL_EDGE_ADVERTISED_ADDRESSES: tunnel.${EXTERNAL_DOMAIN}:443
              TOWONEL_EDGE_ENABLED: "true"
              TOWONEL_EDGE_HEALTH_LISTEN_ADDR: 0.0.0.0:9090
              TOWONEL_EDGE_IROH_PORT: "51820"
              TOWONEL_EDGE_LISTEN_ADDR: 0.0.0.0:8444
              # Read the client address from Envoy's PROXY v2 header. Only peers in
              # private ranges (the default trust list) may send one.
              TOWONEL_EDGE_PROXY_PROTOCOL: "true"
              TOWONEL_HUB_ENABLED: "true"
              TOWONEL_HUB_HEALTH_LISTEN_ADDR: 0.0.0.0:9091
              TOWONEL_HUB_LISTEN_ADDR: 0.0.0.0:8443
              TOWONEL_HUB_PUBLIC_URL: https://tunnel.${EXTERNAL_DOMAIN}
            envFrom:
              - secretRef:
                  name: towonel-hub-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 9090
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 9090
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 60
                  httpGet:
                    path: /health
                    port: 9090
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              # The binary carries the NET_BIND_SERVICE file capability. With it
              # outside the bounding set the kernel refuses the exec
              # ("exec /usr/local/bin/towonel: operation not permitted").
              capabilities:
                add: ["NET_BIND_SERVICE"]
                drop: ["ALL"]
              readOnlyRootFilesystem: true

    persistence:
      data:
        existingClaim: towonel-data-pvc
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      hub:
        # Control plane: the agent bootstraps here and fetches the edges to dial
        hostnames:
          - tunnel.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8443

    service:
      app:
        controller: towonel
        ports:
          edge:
            port: 8444
          hub:
            port: 8443
          quic:
            port: 51820
            protocol: UDP
