---
# Everything below *.extern.${EXTERNAL_DOMAIN} is served from the homelab. Envoy
# passes the TLS stream through untouched; which hostnames exist is decided at
# home (agent services), so moving a hostname needs no change here.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: towonel
spec:
  hostnames:
    - "*.extern.${EXTERNAL_DOMAIN}"
  parentRefs:
    - name: envoy-external
      sectionName: tunnel
  rules:
    - backendRefs:
        - name: towonel
          port: 8444

---
# The edge reads the client address from this header and hands it on to the
# agent, which passes it to envoy-tunnel at home the same way.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: towonel-proxy-protocol
spec:
  proxyProtocol:
    version: V2
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: TLSRoute
      name: towonel

---
# QUIC from the agent. Envoy binds the port on the node (hostNetwork).
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: towonel-quic
spec:
  parentRefs:
    - name: envoy-external
      sectionName: towonel-quic
  rules:
    - backendRefs:
        - name: towonel
          port: 51820
