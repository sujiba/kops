---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 1.9.3
      url: oci://mirror.gcr.io/envoyproxy/gateway-helm
  interval: 1h

  values:
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
          enableEnvoyPatchPolicy: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
    global:
      imageRegistry: mirror.gcr.io
