---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: endurain
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: endurain

  values:
    controllers:
      endurain:
        replicas: 1
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          endurain:
            image:
              repository: ghcr.io/endurain-project/endurain
              tag: v0.20.1
            env:
              TZ: Europe/Berlin
              ENDURAIN_HOST: "https://endurain.${EXTERNAL_DOMAIN}"
              BEHIND_PROXY: true
              TRUSTED_PROXIES: "10.244.0.0/16"
              SMTP_HOST: smtp-relay.network.svc.cluster.local
              SMTP_PORT: "2525"
              SMTP_FROM: "Endurain <no-reply@${MAIL_DOMAIN}>"
              SMTP_SECURE: "false"
              DB_HOST: endurain-postgres-rw
            envFrom:
              - secretRef:
                  name: endurain-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 300Mi

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: endurain-pvc
        globalMounts:
          - path: /app/backend/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /app/backend/logs

    route:
      endurain:
        hostnames: ["endurain.${EXTERNAL_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https

    service:
      endurain:
        ports:
          http:
            port: 8080
