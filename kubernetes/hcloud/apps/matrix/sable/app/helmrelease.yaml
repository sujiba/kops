---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sable
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  interval: 1h

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

    controllers:
      sable:
        replicas: 1
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/sableclient/sable
              tag: 1.22.11@sha256:08b78065c4a55c8afabf78cab33afa3bbe4e5c9b2a685625399d88bd3c0f6e32
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /index.html
                    port: 8080
                  periodSeconds: 30
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    service:
      app:
        controller: sable
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames: ["chat.${EXTERNAL_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080

    persistence:
      config-file:
        type: configMap
        name: sable-config
        globalMounts:
          - path: /app/config.json
            subPath: config.json
            readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      config:
        type: emptyDir
        globalMounts:
          - path: /config
