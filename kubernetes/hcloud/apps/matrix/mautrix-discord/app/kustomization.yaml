---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./database.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./secrets.sops.yaml

configMapGenerator:
  - name: mautrix-discord-configmap
    files:
      - ./resources/config.yaml
generatorOptions:
  disableNameSuffixHash: true
