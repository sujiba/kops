---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: continuwuity
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  interval: 1h

  values:
    defaultPodOptions:
      # Federation does a lot of external DNS lookups; ndots:5 multiplies them
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      continuwuity:
        # RocksDB can't handle two instances on the same volume at once
        type: statefulset

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: forgejo.ellis.link/continuwuation/continuwuity
              tag: v26.9.1@sha256:c9c62bc5c0a641f3f713945c701b069c7bc30d2612b54d4a5de80a5be19d5420
            env:
              TZ: Europe/Berlin
              CONDUWUIT_CONFIG: /etc/conduwuit/conduwuit.toml
            envFrom:
              - secretRef:
                  name: continuwuity-secret

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_matrix/client/versions
                    port: 8008
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probe

            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: continuwuity
        ports:
          http:
            port: 8008

    route:
      app:
        hostnames: ["matrix.${EXTERNAL_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8008

    persistence:
      config:
        type: configMap
        name: continuwuity-config
        globalMounts:
          - path: /etc/conduwuit
            readOnly: true
      data:
        existingClaim: continuwuity
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
