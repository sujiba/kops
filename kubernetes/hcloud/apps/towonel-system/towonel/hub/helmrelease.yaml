---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-hub
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-hub
  interval: 1h
  values:
    controllers:
      towonel-hub:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: codeberg.org/towonel/towonel-node
              tag: 1.9.0@sha256:343b9bef2f47839f6d3d375539e81f9e2e8634db21cc7ca29d37343e10ecc633
            env:
              RUST_LOG: info
              TOWONEL_DATA_DIR: /data
              TOWONEL_EDGE_ENABLED: "false"
              TOWONEL_HUB_DB_DRIVER: sqlite
              TOWONEL_HUB_ENABLED: "true"
              TOWONEL_HUB_HEALTH_LISTEN_ADDR: 0.0.0.0:9091
              # Control link for the edges, stays in-cluster
              TOWONEL_HUB_LINK_LISTEN_ADDR: 0.0.0.0:51444
              TOWONEL_HUB_LISTEN_ADDR: 0.0.0.0:8443
              TOWONEL_HUB_PUBLIC_URL: https://twnl.${EXTERNAL_DOMAIN}
            envFrom:
              - secretRef:
                  name: towonel-hub-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: 8443
              readiness: *probe
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true

    persistence:
      data:
        existingClaim: towonel-hub-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        hostnames:
          - twnl.${EXTERNAL_DOMAIN}
          - tunnel.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8443

    service:
      app:
        controller: towonel-hub
        ports:
          http:
            port: 8443
          link:
            port: 51444
