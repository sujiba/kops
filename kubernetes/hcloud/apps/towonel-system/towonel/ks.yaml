---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: towonel-hub
spec:
  interval: 1h
  path: ./kubernetes/hcloud/apps/towonel-system/towonel/hub
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: towonel-system
  wait: false

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: towonel-edge
spec:
  dependsOn:
    - name: towonel-hub
  interval: 1h
  path: ./kubernetes/hcloud/apps/towonel-system/towonel/edge
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: towonel-system
  wait: false
