---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 0.8.2
      url: oci://ghcr.io/rajsinghtech/charts/garage-operator
  interval: 1h
  values:
    crds:
      install: true
      keep: true
    webhooks:
      enabled: true
      certManager:
        enabled: true
    serviceMonitor:
      enabled: true
