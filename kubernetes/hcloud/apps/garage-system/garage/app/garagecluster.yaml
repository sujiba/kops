---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/garage.rajsingh.info/garagecluster_v1beta2.json
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage
spec:
  image: dxflrs/garage:v2.4.1
  layoutPolicy: Manual
  replication:
    factor: 1
  database:
    engine: lmdb
  s3Api:
    region: us-east-1
    rootDomain: .s3.${EXTERNAL_DOMAIN}
  network:
    rpcSecretRef:
      name: garage-operator-secret
      key: rpc-secret
  admin:
    adminTokenSecretRef:
      name: garage-operator-secret
      key: admin-token
    metricsTokenSecretRef:
      name: garage-operator-secret
      key: metrics-token
  storage:
    replicas: 1
    metadata:
      storageClassName: openebs-hostpath
      size: 1Gi
    data:
      storageClassName: openebs-hostpath
      size: 10Gi
