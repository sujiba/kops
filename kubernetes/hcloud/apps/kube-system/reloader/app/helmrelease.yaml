---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 2.2.18
      url: oci://ghcr.io/stakater/charts/reloader
  interval: 1h
  values:
    fullnameOverride: reloader
    reloader:
      enableHA: true
      deployment:
        replicas: 1
      readOnlyRootFileSystem: true
